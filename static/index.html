<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detect layout regions in historical manuscript pages.">
    <title>Manuscript Region Detector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="page-glow page-glow-one"></div>
    <div class="page-glow page-glow-two"></div>

    <header class="site-header">
        <a class="brand" href="/" aria-label="Manuscript Region Detector home">
            <span class="brand-mark">M</span>
            <span>Manuscript AI</span>
        </a>
        <nav aria-label="Page navigation">
            <a href="#detector">Detector</a>
            <a href="/docs" target="_blank" rel="noreferrer">API Docs</a>
        </nav>
    </header>

    <main>
        <section class="detector-section" id="detector">
            <div class="section-heading">
                <div>
                    <span class="step-number">01</span>
                    <h2>Analyze a manuscript</h2>
                </div>
                <p>PNG, JPG, WebP, BMP or TIFF</p>
            </div>

            <div class="workspace-card">
                <form id="uploadForm">
                    <label class="drop-zone" id="dropZone" for="imageInput">
                        <input id="imageInput" name="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff" hidden>
                        <span class="upload-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none">
                                <path d="M12 16V4m0 0L7 9m5-5 5 5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <strong>Drop your manuscript here</strong>
                        <span>or <u>browse from your computer</u></span>
                    </label>

                    <div class="selected-file hidden" id="selectedFile">
                        <img id="filePreview" alt="Selected manuscript preview">
                        <div class="file-details">
                            <strong id="fileName"></strong>
                            <span id="fileSize"></span>
                        </div>
                        <button class="remove-button" id="removeFile" type="button" aria-label="Remove selected image">&times;</button>
                    </div>

                    <button class="analyze-button" id="analyzeButton" type="submit" disabled>
                        <span>Detect regions</span>
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M5 12h14m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>

        <section class="results-section hidden" id="resultsSection">
            <div class="section-heading">
                <div>
                    <span class="step-number">02</span>
                    <h2>Detection result</h2>
                </div>
                <a class="download-link" id="metadataLink" href="#" download>Download JSON</a>
            </div>

            <div class="results-grid">
                <figure class="result-image-wrap">
                    <img id="resultImage" alt="Annotated manuscript detection result">
                </figure>
                <aside class="region-panel">
                    <div class="region-summary">
                        <span>Regions found</span>
                        <strong id="regionCount">0</strong>
                    </div>
                    <div id="regionList" class="region-list"></div>
                </aside>
            </div>
        </section>

    </main>

    <footer>
        <span>Manuscript Region Detector</span>
        <span>OpenCV + FastAPI</span>
    </footer>
    <script src="/static/app.js"></script>
</body>
</html>
